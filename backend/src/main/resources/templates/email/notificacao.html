<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Monitoria MAP</title>
</head>
<body style="margin:0;padding:24px 12px;background:#F3EEE6;font-family:'Atkinson Hyperlegible Next','Segoe UI',Helvetica,Arial,sans-serif;color:#1E1B18;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;">
    <tr>
        <td style="padding:0 4px 16px;font-size:16px;font-weight:800;letter-spacing:-0.01em;">
            Monitoria MAP
        </td>
    </tr>
    <tr>
        <td style="background:#FFFFFF;border:1px solid #E6DDCF;border-radius:20px;padding:28px;">
            <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;font-weight:800;" th:text="${titulo}">Título</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#665D55;" th:text="${mensagem}">Mensagem</p>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="background:#FAF7F2;border:1px solid #E6DDCF;border-radius:14px;margin-bottom:24px;">
                <tr>
                    <td style="padding:16px 18px;font-size:14px;line-height:1.7;color:#665D55;">
                        <strong style="color:#1E1B18;font-size:15px;" th:text="${solicitacao.titulo}">Título da dúvida</strong><br>
                        <span th:text="${solicitacao.topico.nome}">Tópico</span> ·
                        <span th:text="${solicitacao.modalidade.name() == 'ONLINE' ? 'Online' : 'Presencial'}">Online</span> ·
                        <span th:text="${solicitacao.aluno.nome}">Aluno</span>
                    </td>
                </tr>
            </table>

            <a th:href="${link}" href="#"
               style="display:inline-block;background:#0B8571;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:700;padding:13px 22px;border-radius:14px;"
               th:text="${botao}">Abrir</a>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 4px 0;font-size:13px;line-height:1.5;color:#7A7067;">
            Você recebeu este e-mail porque participa da monitoria de Métodos Avançados em Programação.
        </td>
    </tr>
</table>
</body>
</html>
