<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monitoria MAP</title>
</head>
<body style="margin:0;padding:24px 12px;background:#F3EEE6;font-family:'Atkinson Hyperlegible Next','Segoe UI',Helvetica,Arial,sans-serif;color:#1E1B18;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;margin:0 auto;">
    <tr>
        <td style="padding:0 4px 16px;font-size:16px;font-weight:800;">Monitoria MAP</td>
    </tr>
    <tr>
        <td style="background:#FFFFFF;border:1px solid #E6DDCF;border-radius:20px;padding:28px;">
            <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;font-weight:800;"
                th:text="${cadastro} ? 'Confirme o seu e-mail' : 'Trocar a sua senha'">Confirme o seu e-mail</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#665D55;">
                Oi, <span th:text="${nome}">Maria</span>.
                <span th:text="${cadastro} ? 'Use o código abaixo para ativar a sua conta.' : 'Use o código abaixo para criar uma senha nova.'">Use o código abaixo.</span>
            </p>
            <p style="margin:0 0 22px;padding:18px 0;background:#FAF7F2;border:1px solid #E6DDCF;border-radius:14px;text-align:center;font-size:32px;font-weight:800;letter-spacing:0.3em;font-family:'Atkinson Hyperlegible Mono',Consolas,monospace;"
               th:text="${codigo}">123456</p>
            <p style="margin:0;font-size:14px;line-height:1.6;color:#665D55;">
                O código vale por 15 minutos. Se não foi você que pediu, pode ignorar este e-mail.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
